apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: roundcube-mail
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ali-safapour/my-cloud-platform.git
    targetRevision: HEAD
    path: k8s/workloads/roundcube
  destination:
    server: https://kubernetes.default.svc
    namespace: mail-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
