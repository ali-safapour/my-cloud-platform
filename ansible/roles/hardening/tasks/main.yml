---
- name: Install base security packages and monitoring tools
  apt:
    name:
      - iptables
      - iptables-persistent
      - fail2ban
      - chrony
      - curl
      - htop
    state: present
    update_cache: yes
    cache_valid_time: 3600

- name: Apply Linux kernel security settings (sysctl hardening)
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
  loop:
    - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
    - { name: 'net.ipv4.conf.default.rp_filter', value: '1' }
    - { name: 'net.ipv4.tcp_syncookies', value: '1' }
    - { name: 'net.ipv4.conf.all.accept_redirects', value: '0' }
    - { name: 'net.ipv4.conf.all.send_redirects', value: '0' }
    - { name: 'net.ipv4.icmp_echo_ignore_broadcasts', value: '1' }

- name: Secure SSH server configuration
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: '/usr/sbin/sshd -t -f %s'
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
  notify: Restart ssh service

- name: Allow loopback traffic
  iptables:
    chain: INPUT
    in_interface: lo
    jump: ACCEPT

- name: Allow established and related connections
  iptables:
    chain: INPUT
    ctstate: ['ESTABLISHED', 'RELATED']
    jump: ACCEPT

- name: Allow inbound SSH traffic on port 22
  iptables:
    chain: INPUT
    protocol: tcp
    destination_port: 22
    jump: ACCEPT

- name: Allow VRRP protocol for Keepalived cluster
  iptables:
    chain: INPUT
    protocol: vrrp
    jump: ACCEPT

- name: Set default INPUT policy to DROP
  iptables:
    chain: INPUT
    policy: DROP

- name: Save firewall rules persistently
  command: netfilter-persistent save
  changed_when: false

- name: Ensure fail2ban and chrony are enabled and started
  systemd:
    name: "{{ item }}"
    state: started
    enabled: yes
  loop:
    - fail2ban
    - chrony
