---
- name: Create ArgoCD namespace manifest
  ansible.builtin.command: kubectl create namespace {{ argocd_namespace }} --dry-run=client -o yaml
  register: argocd_ns_yaml
  changed_when: false

- name: Apply ArgoCD namespace
  ansible.builtin.command: kubectl apply -f -
  args:
    stdin: "{{ argocd_ns_yaml.stdout }}"
  changed_when: false

- name: Download official ArgoCD installation manifest
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml"
    dest: /tmp/argocd-install.yaml
    mode: '0644'

- name: Install ArgoCD components using Server-Side Apply
  ansible.builtin.command: >
    kubectl apply -n {{ argocd_namespace }}
    --server-side
    --force-conflicts
    -f /tmp/argocd-install.yaml
  register: argocd_install_result
  changed_when: "'configured' in argocd_install_result.stdout or 'created' in argocd_install_result.stdout"

- name: Expose ArgoCD server via NodePort
  ansible.builtin.command: >
    kubectl patch svc argocd-server -n {{ argocd_namespace }}
    -p '{"spec": {"type": "NodePort", "ports": [{"name": "https", "port": 443, "targetPort": 8080, "nodePort": {{ argocd_nodeport }}}]}}'
  changed_when: false

- name: Wait for ArgoCD server deployment to be ready
  ansible.builtin.command: >
    kubectl wait --for=condition=Available deployment/argocd-server
    -n {{ argocd_namespace }}
    --timeout=300s
  changed_when: false

- name: Copy Root Application manifest to master node
  ansible.builtin.copy:
    src: root-application.yaml
    dest: /tmp/root-application.yaml
    mode: '0644'
  when: inventory_hostname in groups['masters']

- name: Deploy GitOps Root Application (App of Apps bootstrap)
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/root-application.yaml
  register: root_app_result
  changed_when: "'created' in root_app_result.stdout or 'configured' in root_app_result.stdout"
  when: inventory_hostname in groups['masters']

- name: Render ArgoCD SSO ConfigMap from Jinja2 template
  ansible.builtin.template:
    src: argocd-cm-patch.yaml.j2
    dest: /tmp/argocd-cm-patch.yaml
    mode: '0644'
  when: inventory_hostname in groups['masters']

- name: Copy ArgoCD RBAC ConfigMap manifest
  ansible.builtin.copy:
    src: argocd-rbac-cm-patch.yaml
    dest: /tmp/argocd-rbac-cm-patch.yaml
    mode: '0644'
  when: inventory_hostname in groups['masters']

- name: Apply ArgoCD LDAP SSO and RBAC configuration
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/argocd-cm-patch.yaml -f /tmp/argocd-rbac-cm-patch.yaml
  register: sso_patch_result
  changed_when: "'configured' in sso_patch_result.stdout"
  when: inventory_hostname in groups['masters']

- name: Restart ArgoCD Server and Dex to load SSO configuration
  ansible.builtin.command:
    cmd: kubectl rollout restart deployment argocd-server argocd-dex-server -n {{ argocd_namespace }}
  when:
    - inventory_hostname in groups['masters']
    - sso_patch_result.changed

- name: Display ArgoCD Access Information
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "  ArgoCD {{ argocd_version }} Installed & Ready!"
      - "  URL:      https://{{ ansible_host }}:{{ argocd_nodeport }}"
      - "  Username: admin"
      - "  To get password securely, run:"
      - "    kubectl -n {{ argocd_namespace }} get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d"
      - "=================================================="

